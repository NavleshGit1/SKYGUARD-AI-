name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (* /10 * * * in standard cron)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ping Render Backend
        env:
          # Set RENDER_BACKEND_URL in GitHub Repository Secrets or replace with your live URL below
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://skyguard-backend.onrender.com' }}
        run: |
          python scripts/keep_alive.py --url "$RENDER_BACKEND_URL" --once
