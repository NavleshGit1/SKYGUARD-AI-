services:
  # 1. SkyGuard AI FastAPI Streaming Backend Service
  - type: web
    name: skyguard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TELEMETRY_HMAC_SECRET
        value: sih2026-skyguard-shared-hmac-key-imd-defense-grade
      - key: HMAC_SECRET_KEY
        value: sih2026-skyguard-shared-hmac-key-imd-defense-grade
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. SkyGuard AI React + Vite Frontend Static Site (Global Edge CDN)
  - type: web
    name: skyguard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skyguard-backend
          property: host
