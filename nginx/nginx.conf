events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # VULN-13 FIX: Hide server version from response headers (information disclosure)
    server_tokens off;

    # Performance optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # VULN-10 FIX: Content Security Policy — prevents XSS and data injection
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' ws://localhost:8000 wss://localhost:8000 ws://localhost ws://127.0.0.1:8000; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';" always;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Rate Limiting — 30 req/s per IP with 50 request burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream backend_api {
        server backend:8000;
    }

    upstream frontend_ui {
        server frontend:5173;
    }

    # ── HTTP → HTTPS redirect (VULN-13 FIX: enforce TLS in production) ──────
    # For development, keep port 80. For production, uncomment the 443 block
    # below and redirect HTTP → HTTPS.
    #
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     ...rest of location blocks...
    # }

    server {
        listen 80;
        server_name localhost;

        # WebSocket Reverse Proxy Hub (VULN-09: clients now pass ?token= for auth)
        location /api/v1/ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API Routes with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger Docs (disabled in production via FastAPI; kept for nginx completeness)
        location /docs {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
